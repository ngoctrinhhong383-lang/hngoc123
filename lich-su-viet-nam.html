<script>
const slides=[{"title":"Hành trình lịch sử Việt Nam","body":"Từ những cộng đồng cư dân đầu tiên, các nhà nước cổ đại, nghìn năm đấu tranh giành tự chủ đến công cuộc xây dựng đất nước hiện đại. Bộ trình chiếu gồm 38 trang, có thể dùng phím mũi tên để chuyển trang.","image":"https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1600&q=85","era":"Khái quát","kicker":"Mở đầu","label":"Khái quát","n":1},{"title":"Vị trí địa lý tạo nên bản sắc","body":"Việt Nam nằm ở rìa phía đông bán đảo Đông Dương, hướng ra Biển Đông, có đồng bằng, trung du, núi cao và đường bờ biển dài. Địa hình đa dạng tạo điều kiện phát triển nông nghiệp, giao thương đường biển và hình thành nhiều vùng văn hóa.","image":"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=80","era":"Khái quát","kicker":"Đất nước và con người","label":"Khái quát","n":2},{"title":"Dấu tích người Việt cổ","body":"Các di chỉ khảo cổ như Núi Đọ, Sơn Vi, Hòa Bình và Bắc Sơn cho thấy con người đã sinh sống, săn bắt, hái lượm và dần biết chế tác công cụ đá từ rất sớm. Qua thời gian, cư dân phát triển kỹ thuật mài đá, làm gốm và tổ chức đời sống cộng đồng.","image":"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=80","era":"Buổi đầu","kicker":"Thời tiền sử","label":"Buổi đầu","n":3},{"title":"Trống đồng và kỹ thuật luyện kim","body":"Văn hóa Đông Sơn phát triển nổi bật ở lưu vực sông Hồng và Bắc Trung Bộ vào khoảng thiên niên kỷ I TCN. Trống đồng, vũ khí, công cụ đồng và hình khắc sinh hoạt phản ánh kỹ thuật đúc tinh xảo, đời sống nông nghiệp và nghi lễ cộng đồng.","image":"https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=1400&q=80","era":"Buổi đầu","kicker":"Văn hóa Đông Sơn","label":"Buổi đầu","n":4},{"title":"Truyền thống dựng nước","body":"Theo truyền thuyết dân tộc, các vua Hùng lập nước Văn Lang, trung tâm ở vùng Phong Châu. Truyền thuyết không thay thế tư liệu khảo cổ, nhưng góp phần lưu giữ ký ức cộng đồng về nguồn gốc, tinh thần liên kết và nền văn minh nông nghiệp lúa nước.","image":"https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1400&q=80","era":"Buổi đầu","kicker":"Nhà nước Văn Lang","label":"Buổi đầu","n":5},{"title":"Thành Cổ Loa và tổ chức phòng thủ","body":"Khoảng cuối thế kỷ III TCN, Thục Phán thống nhất Âu Việt và Lạc Việt, lập nước Âu Lạc. Thành Cổ Loa với cấu trúc nhiều vòng thành và hệ thống hào là dấu tích quan trọng cho thấy quy mô tổ chức xã hội, kỹ thuật xây dựng và nhu cầu phòng thủ.","image":"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80","era":"Buổi đầu","kicker":"Âu Lạc","label":"Buổi đầu","n":6},{"title":"Mất quyền tự chủ và sức sống văn hóa","body":"Từ cuối thế kỷ II TCN, vùng đất Việt nhiều lần nằm dưới các triều đại phương Bắc. Bộ máy cai trị, thuế khóa và chính sách đồng hóa tạo ra nhiều sức ép, nhưng làng xã, tiếng nói, tín ngưỡng và tập quán bản địa vẫn được duy trì, biến đổi qua giao lưu.","image":"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=80","era":"Đấu tranh tự chủ","kicker":"Thời Bắc thuộc","label":"Đấu tranh tự chủ","n":7},{"title":"Năm 40: cuộc nổi dậy lớn","body":"Trưng Trắc và Trưng Nhị lãnh đạo cuộc khởi nghĩa chống chính quyền Đông Hán năm 40. Nghĩa quân nhanh chóng giành được nhiều thành trì, tạo dựng chính quyền trong một thời gian ngắn. Cuộc khởi nghĩa trở thành biểu tượng nổi bật về ý chí tự chủ và vai trò của phụ nữ.","image":"https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1400&q=80","era":"Đấu tranh tự chủ","kicker":"Khởi nghĩa Hai Bà Trưng","label":"Đấu tranh tự chủ","n":8},{"title":"Khát vọng độc lập thế kỷ III","body":"Năm 248, Triệu Thị Trinh cùng anh là Triệu Quốc Đạt và lực lượng địa phương nổi dậy chống nhà Ngô. Cuộc khởi nghĩa bị đàn áp, nhưng hình tượng Bà Triệu được lưu truyền như biểu tượng của lòng can đảm và khát vọng thoát khỏi ách cai trị.","image":"https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=80","era":"Đấu tranh tự chủ","kicker":"Bà Triệu","label":"Đấu tranh tự chủ","n":9},{"title":"Nỗ lực xây dựng chính quyền riêng","body":"Năm 542, Lý Bí lãnh đạo cuộc khởi nghĩa thắng lợi; năm 544 xưng đế, đặt quốc hiệu Vạn Xuân. Dù nhà nước còn non trẻ và phải đối mặt với các cuộc tiến công, sự kiện thể hiện bước phát triển quan trọng của tư tưởng xây dựng một chính quyền độc lập.","image":"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=80","era":"Đấu tranh tự chủ","kicker":"Lý Bí và nước Vạn Xuân","label":"Đấu tranh tự chủ","n":10},{"title":"Kháng chiến ở đầm Dạ Trạch","body":"Sau khi Lý Nam Đế thất bại, Triệu Quang Phục tiếp tục kháng chiến, tận dụng địa hình đầm lầy Dạ Trạch và lối đánh linh hoạt. Cuộc đấu tranh cho thấy khả năng dựa vào địa hình, sự am hiểu địa phương và sự bền bỉ để duy trì lực lượng.","image":"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=80","era":"Đấu tranh tự chủ","kicker":"Triệu Việt Vương","label":"Đấu tranh tự chủ","n":11},{"title":"Các cuộc nổi dậy từ lòng dân","body":"Đầu thế kỷ VIII, Mai Thúc Loan lãnh đạo cuộc nổi dậy lớn ở Hoan Châu; cuối thế kỷ VIII, Phùng Hưng nổi dậy và kiểm soát được Tống Bình trong một thời gian. Những phong trào này phản ánh bất mãn với chính sách cai trị và mạng lưới liên kết rộng trong xã hội.","image":"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80","era":"Đấu tranh tự chủ","kicker":"Mai Thúc Loan và Phùng Hưng","label":"Đấu tranh tự chủ","n":12},{"title":"Ngô Quyền mở ra thời kỳ độc lập","body":"Năm 938, Ngô Quyền đánh bại quân Nam Hán trên sông Bạch Đằng. Việc tận dụng thủy triều và bãi cọc góp phần tạo nên chiến thắng quyết định, chấm dứt thời kỳ lệ thuộc kéo dài và mở đường cho việc xây dựng nhà nước tự chủ lâu dài.","image":"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=80","era":"Độc lập tự chủ","kicker":"Chiến thắng Bạch Đằng 938","label":"Độc lập tự chủ","n":13},{"title":"Bài toán thống nhất đất nước","body":"Sau khi Ngô Quyền mất, chính quyền trung ương suy yếu, nhiều thủ lĩnh cát cứ. Tình trạng phân tranh gây bất ổn và cho thấy nền độc lập cần đi cùng bộ máy quản lý đủ mạnh, khả năng dung hòa các lực lượng địa phương và trật tự chính trị.","image":"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=80","era":"Độc lập tự chủ","kicker":"Nhà Ngô và loạn 12 sứ quân","label":"Độc lập tự chủ","n":14},{"title":"Thống nhất và lập nhà nước Đại Cồ Việt","body":"Đinh Bộ Lĩnh dẹp loạn 12 sứ quân, thống nhất đất nước năm 968, đặt quốc hiệu Đại Cồ Việt và đóng đô ở Hoa Lư. Triều Đinh củng cố quyền lực trung ương, tổ chức quân đội và đặt nền tảng cho nhà nước độc lập sau thời kỳ phân tranh.","image":"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=80","era":"Độc lập tự chủ","kicker":"Đinh Bộ Lĩnh","label":"Độc lập tự chủ","n":15},{"title":"Bảo vệ nền độc lập non trẻ","body":"Năm 980, Lê Hoàn lên ngôi trong bối cảnh nhà Tống chuẩn bị xâm lược. Quân Đại Cồ Việt giành thắng lợi năm 981. Triều Tiền Lê tiếp tục củng cố quốc gia, duy trì quan hệ bang giao và bảo vệ thành quả thống nhất.","image":"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=80","era":"Độc lập tự chủ","kicker":"Tiền Lê","label":"Độc lập tự chủ","n":16},{"title":"Dời đô ra Thăng Long năm 1010","body":"Lý Công Uẩn lên ngôi năm 1009 và dời đô từ Hoa Lư ra Đại La, đổi tên thành Thăng Long năm 1010. Vị trí trung tâm đồng bằng thuận lợi cho giao thông, kinh tế và quản lý. Triều Lý xây dựng bộ máy nhà nước, phát triển Phật giáo và văn hóa cung đình.","image":"https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Nhà Lý","label":"Đại Việt","n":17},{"title":"Chủ động chiến lược và phòng tuyến Như Nguyệt","body":"Dưới thời Lý, Lý Thường Kiệt chủ trương tiến công trước vào các căn cứ hậu cần của đối phương năm 1075, sau đó tổ chức phòng thủ trên sông Như Nguyệt. Cuộc kháng chiến kết thúc bằng việc bảo vệ được nền độc lập và mở ra giai đoạn bang giao.","image":"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Kháng chiến chống Tống 1075–1077","label":"Đại Việt","n":18},{"title":"Tổ chức quốc gia và sức mạnh cộng đồng","body":"Nhà Trần thay nhà Lý năm 1225, xây dựng bộ máy quản lý và quân đội có tổ chức. Chính sách gắn kết triều đình với quý tộc, tướng lĩnh và cộng đồng làng xã góp phần tạo sức mạnh trong các cuộc kháng chiến, đồng thời thúc đẩy đời sống văn hóa và giáo dục.","image":"https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Nhà Trần","label":"Đại Việt","n":19},{"title":"1258, 1285 và 1287–1288","body":"Quân dân Đại Việt ba lần chống quân Mông–Nguyên. Trần Hưng Đạo, Trần Quang Khải, Trần Nhật Duật và nhiều tướng lĩnh phối hợp chiến lược, rút lui bảo toàn lực lượng, phản công đúng thời điểm. Chiến thắng Bạch Đằng năm 1288 là đỉnh cao của nghệ thuật quân sự thời Trần.","image":"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Ba lần kháng chiến chống Mông–Nguyên","label":"Đại Việt","n":20},{"title":"Đồng lòng trước thử thách","body":"Hội nghị Diên Hồng trong truyền thống lịch sử và văn học sử thể hiện tinh thần tham vấn, đoàn kết chống ngoại xâm. Hịch tướng sĩ của Trần Quốc Tuấn khơi dậy trách nhiệm, danh dự và ý thức bảo vệ đất nước, cho thấy vai trò của tư tưởng và tinh thần trong chiến tranh.","image":"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Hội nghị Diên Hồng và Hịch tướng sĩ","label":"Đại Việt","n":21},{"title":"Cải cách trong khủng hoảng","body":"Hồ Quý Ly tiến hành nhiều cải cách về tiền tệ, hành chính, giáo dục và quân sự cuối thế kỷ XIV. Tuy nhiên, cải cách diễn ra trong bối cảnh chính trị thiếu đồng thuận và nguy cơ ngoại xâm tăng cao. Năm 1407, nhà Hồ thất bại trước quân Minh.","image":"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Nhà Hồ và cuộc xâm lược Minh","label":"Đại Việt","n":22},{"title":"Từ căn cứ địa đến giải phóng đất nước","body":"Lê Lợi khởi nghĩa ở Lam Sơn năm 1418. Sau giai đoạn khó khăn, nghĩa quân mở rộng địa bàn, nhận được sự ủng hộ của nhân dân và giành nhiều thắng lợi. Chiến dịch ở Tốt Động–Chúc Động và Chi Lăng–Xương Giang góp phần buộc quân Minh rút về nước.","image":"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Khởi nghĩa Lam Sơn","label":"Đại Việt","n":23},{"title":"Tuyên bố nền độc lập được khôi phục","body":"Năm 1428, Nguyễn Trãi thay mặt Lê Lợi viết Bình Ngô đại cáo, tổng kết cuộc kháng chiến và khẳng định chủ quyền, văn hiến, lãnh thổ và truyền thống riêng của Đại Việt. Tác phẩm là áng văn chính luận quan trọng trong lịch sử tư tưởng Việt Nam.","image":"https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Nguyễn Trãi và Bình Ngô đại cáo","label":"Đại Việt","n":24},{"title":"Luật pháp, giáo dục và quản trị","body":"Thời Lê sơ, đặc biệt dưới triều Lê Thánh Tông, bộ máy hành chính được tổ chức chặt chẽ, luật pháp được hoàn thiện và khoa cử phát triển. Bộ luật Hồng Đức thường được nhắc đến như thành tựu pháp lý tiêu biểu, phản ánh nỗ lực quản lý xã hội và bảo vệ trật tự quốc gia.","image":"https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Nhà Lê sơ","label":"Đại Việt","n":25},{"title":"Giao lưu, di dân và hình thành vùng văn hóa","body":"Trong nhiều thế kỷ, lãnh thổ và không gian cư trú của người Việt mở rộng về phía Nam qua các quá trình chính trị, di dân, khai khẩn và giao lưu. Quá trình này có nhiều chiều cạnh, liên quan đến các cộng đồng Chăm, Khmer và những nhóm cư dân khác, tạo nên bức tranh văn hóa đa dạng.","image":"https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=80","era":"Đại Việt","kicker":"Mở rộng về phương Nam","label":"Đại Việt","n":26},{"title":"Chia cắt và biến động thế kỷ XVII–XVIII","body":"Từ thế kỷ XVII, quyền lực giữa chúa Trịnh ở Đàng Ngoài và chúa Nguyễn ở Đàng Trong hình thành hai vùng chính trị riêng, dẫn đến nhiều cuộc chiến kéo dài. Dù chia cắt, thương mại, đô thị và giao lưu quốc tế vẫn phát triển ở một số trung tâm như Phố Hiến, Hội An.","image":"https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1400&q=80","era":"Biến động","kicker":"Trịnh–Nguyễn phân tranh","label":"Biến động","n":27},{"title":"Từ khởi nghĩa nông dân đến thống nhất","body":"Khởi nghĩa Tây Sơn bùng nổ năm 1771 tại Bình Định, nhanh chóng làm thay đổi cục diện Đàng Trong và Đàng Ngoài. Phong trào lật đổ các tập đoàn cầm quyền cũ, góp phần chấm dứt tình trạng chia cắt và tạo ra một giai đoạn chuyển biến lớn trong lịch sử cuối thế kỷ XVIII.","image":"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=80","era":"Biến động","kicker":"Phong trào Tây Sơn","label":"Biến động","n":28},{"title":"Chiến thắng Ngọc Hồi–Đống Đa","body":"Cuối năm 1788, quân Thanh tiến vào Thăng Long. Nguyễn Huệ lên ngôi Hoàng đế, tiến quân ra Bắc và giành thắng lợi quyết định vào dịp Tết Kỷ Dậu 1789. Chiến thắng thể hiện năng lực tổ chức chiến dịch nhanh, yếu tố bất ngờ và tinh thần chiến đấu của quân Tây Sơn.","image":"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=80","era":"Biến động","kicker":"Quang Trung năm 1789","label":"Biến động","n":29},{"title":"Thống nhất lãnh thổ và cải cách hành chính","body":"Năm 1802, Nguyễn Ánh lập triều Nguyễn, đặt kinh đô ở Huế; năm 1804 sử dụng quốc hiệu Việt Nam trong quan hệ đối ngoại, sau đó quốc hiệu Đại Nam được dùng từ năm 1838. Triều Nguyễn tổ chức lại hành chính, xây dựng công trình cung đình và phát triển hệ thống luật lệ, nhưng cũng đối mặt nhiều thách thức.","image":"https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1400&q=80","era":"Thế kỷ XIX","kicker":"Nhà Nguyễn","label":"Thế kỷ XIX","n":30},{"title":"Từ Đà Nẵng năm 1858 đến mất chủ quyền","body":"Liên quân Pháp–Tây Ban Nha tấn công Đà Nẵng năm 1858. Qua các chiến dịch và hiệp ước trong nửa sau thế kỷ XIX, Pháp từng bước áp đặt quyền kiểm soát. Triều Nguyễn mất dần chủ quyền, xã hội biến đổi sâu sắc dưới tác động của chế độ thuộc địa và kinh tế hàng hóa.","image":"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=80","era":"Thời thuộc địa","kicker":"Pháp xâm lược Việt Nam","label":"Thời thuộc địa","n":31},{"title":"Văn Thân và sĩ phu chống Pháp","body":"Sau biến cố kinh thành Huế năm 1885, phong trào Cần Vương lan rộng, kêu gọi giúp vua chống Pháp. Nhiều cuộc khởi nghĩa do sĩ phu và thủ lĩnh địa phương lãnh đạo, tiêu biểu có Ba Đình, Bãi Sậy và Hương Khê. Phong trào thể hiện lòng yêu nước nhưng gặp hạn chế về tổ chức và đường lối.","image":"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=80","era":"Thời thuộc địa","kicker":"Phong trào Cần Vương","label":"Thời thuộc địa","n":32},{"title":"Những con đường cứu nước mới","body":"Các phong trào Đông Du, Duy Tân và Đông Kinh Nghĩa Thục tìm cách đổi mới giáo dục, kinh tế và tư tưởng, đồng thời tìm con đường giành độc lập. Dù nhiều hoạt động bị đàn áp, chúng góp phần truyền bá tri thức mới, hình thành tầng lớp xã hội mới và đặt ra câu hỏi về mô hình quốc gia hiện đại.","image":"https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=1400&q=80","era":"Thời thuộc địa","kicker":"Đầu thế kỷ XX","label":"Thời thuộc địa","n":33},{"title":"Bước ngoặt giành chính quyền","body":"Trong bối cảnh Nhật đầu hàng Đồng minh, phong trào cách mạng phát triển nhanh vào tháng 8 năm 1945. Việt Minh và quần chúng tại nhiều địa phương giành chính quyền; ngày 2/9/1945, tại Hà Nội, Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa.","image":"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80","era":"Hiện đại","kicker":"Cách mạng tháng Tám 1945","label":"Hiện đại","n":34},{"title":"1946–1954 và Điện Biên Phủ","body":"Chiến tranh toàn quốc bùng nổ tháng 12/1946. Sau nhiều năm kháng chiến, chiến thắng Điện Biên Phủ ngày 7/5/1954 góp phần quyết định buộc Pháp ký Hiệp định Genève. Hiệp định lập lại hòa bình ở Đông Dương, đồng thời Việt Nam tạm thời bị phân chia quân sự ở vĩ tuyến 17 để chờ tổng tuyển cử theo thỏa thuận.","image":"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=80","era":"Hiện đại","kicker":"Kháng chiến chống Pháp","label":"Hiện đại","n":35},{"title":"1954–1975: hai miền, một dân tộc","body":"Sau năm 1954, Việt Nam tồn tại hai chính quyền ở hai miền trong bối cảnh Chiến tranh Lạnh. Xung đột leo thang thành chiến tranh quy mô lớn, gây tổn thất nặng nề cho dân thường, cơ sở hạ tầng và nhiều thế hệ. Các nỗ lực ngoại giao diễn ra song song với chiến sự.","image":"https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=80","era":"Hiện đại","kicker":"Đất nước chia cắt","label":"Hiện đại","n":36},{"title":"Con đường ngoại giao giữa chiến tranh","body":"Hiệp định Paris được ký ngày 27/1/1973, quy định chấm dứt chiến tranh, lập lại hòa bình ở Việt Nam và việc quân đội Hoa Kỳ rút khỏi Việt Nam. Hiệp định là kết quả của đàm phán kéo dài, phản ánh vai trò của ngoại giao, tương quan lực lượng và áp lực quốc tế.","image":"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80","era":"Hiện đại","kicker":"Hiệp định Paris 1973","label":"Hiện đại","n":37},{"title":"Chiến tranh kết thúc, đất nước thống nhất","body":"Chiến dịch Hồ Chí Minh kết thúc ngày 30/4/1975 khi chính quyền Việt Nam Cộng hòa sụp đổ. Sự kiện chấm dứt chiến tranh ở miền Nam và mở đường cho quá trình thống nhất nhà nước. Hậu quả chiến tranh, tái thiết, hòa giải và khắc phục khó khăn tiếp tục là những vấn đề lớn sau năm 1975.","image":"https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1400&q=80","era":"Hiện đại","kicker":"Ngày 30/4/1975","label":"Hiện đại","n":38},{"title":"Chuyển đổi kinh tế và hội nhập","body":"Đại hội VI của Đảng năm 1986 khởi xướng đường lối Đổi mới, từng bước chuyển cơ chế quản lý kinh tế và mở rộng quan hệ đối ngoại. Việt Nam tham gia ASEAN năm 1995, gia nhập WTO năm 2007 và tăng cường hội nhập khu vực, toàn cầu. Quá trình phát triển vẫn đặt ra thách thức về công bằng, môi trường và năng suất.","image":"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=80","era":"Hiện đại","kicker":"Đổi mới từ năm 1986","label":"Hiện đại","n":39},{"title":"Di sản, đổi mới và trách nhiệm công dân","body":"Việt Nam hiện đại vừa gìn giữ di sản, tiếng Việt và bản sắc vùng miền, vừa phát triển giáo dục, khoa học, công nghệ và kinh tế số. Bảo vệ môi trường, tôn trọng sự đa dạng, tìm hiểu lịch sử từ nhiều nguồn đáng tin cậy và tham gia xây dựng cộng đồng là những cách thế hệ trẻ tiếp nối hành trình dân tộc.","image":"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=80","era":"Hiện đại","kicker":"Việt Nam hôm nay","label":"Hiện đại","n":40},{"title":"Nhìn lịch sử như một hành trình","body":"Lịch sử Việt Nam không chỉ là danh sách triều đại và chiến trận. Đó còn là câu chuyện về cách cộng đồng thích nghi với thiên nhiên, tổ chức xã hội, giao lưu văn hóa, đấu tranh cho tự chủ và xây dựng tương lai. Hãy đặt câu hỏi, đối chiếu tư liệu và nhìn nhận các giai đoạn trong bối cảnh lịch sử cụ thể.","image":"https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1400&q=80","era":"Kết luận","kicker":"Tổng kết","label":"Kết luận","n":41},{"title":"Cùng ôn tập và trao đổi","body":"1. Vì sao chiến thắng Bạch Đằng năm 938 có ý nghĩa bước ngoặt? 2. Những yếu tố nào giúp Đại Việt chiến thắng quân Mông–Nguyên? 3. Các phong trào yêu nước đầu thế kỷ XX khác nhau ở điểm nào? 4. Đổi mới từ năm 1986 đã thay đổi đời sống kinh tế – xã hội ra sao? Hãy dùng dẫn chứng và nguồn tư liệu để giải thích.","image":"https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=1400&q=80","era":"Kết luận","kicker":"Câu hỏi thảo luận","label":"Kết luận","n":42},{"title":"Đọc thêm để kiểm chứng tư liệu","body":"Khi hoàn thiện bài thuyết trình, nên đối chiếu sách giáo khoa Lịch sử và Địa lí/Lịch sử theo chương trình học, các công trình của Viện Sử học, tư liệu tại Bảo tàng Lịch sử Quốc gia và hồ sơ di sản của UNESCO. Ảnh minh họa trên trang lấy từ Unsplash; cần ghi nguồn ảnh cụ thể khi dùng trong bài nộp chính thức.","image":"https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1400&q=80","era":"Kết luận","kicker":"Nguồn tham khảo","label":"Kết luận","n":43}];
let index=0;const $=id=>document.getElementById(id);
function show(n){index=Math.max(0,Math.min(slides.length-1,n));const s=slides[index];$('era').textContent=s.era;$('num').textContent='TRANG '+String(s.n).padStart(2,'0')+' / '+slides.length;$('title').textContent=s.title;$('body').textContent=s.body;$('photo').src=s.image;$('photo').alt='Ảnh minh họa cho chủ đề: '+s.title;$('label').textContent=s.label;$('counter').textContent=(index+1)+' / '+slides.length;$('bar').style.width=((index+1)/slides.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;document.title=s.title+' — Lịch sử Việt Nam';}
function toggle(){ $('overview').classList.toggle('open'); }
$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('all').onclick=toggle;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key==='Escape')$('overview').classList.remove('open')});
$('thumbs').innerHTML=slides.map((s,i)=>'<button class="thumb" data-i="'+i+'"><b>'+String(i+1).padStart(2,'0')+'. '+s.title.replace(/</g,'&lt;')+'</b><span>'+s.era+'</span></button>').join('');
$('thumbs').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){show(Number(b.dataset.i));$('overview').classList.remove('open')}});
show(0);
</script></body></html>
